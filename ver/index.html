<title>발리 허니문 · 12/3-12/11</title>
<style>
  :root{
    --ink:#1e2a22;
    --paper:#faf7f0;
    --paper-2:#f1ecdf;
    --line:#ddd3bb;
    --terracotta:#c1653a;
    --leaf:#5c7a52;
    --leaf-deep:#3f5a3a;
    --sand:#e8dcc0;
    --gold:#b8925a;
    --white:#fffdf8;
    --shadow:0 2px 10px rgba(50,40,20,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:var(--paper);
    color:var(--ink);
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    transition:max-width .2s;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    padding:22px 20px 16px;
    background:linear-gradient(160deg, var(--leaf-deep) 0%, var(--leaf) 100%);
    color:var(--white);
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-30px; top:-40px;
    width:160px;height:160px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .topbar-title{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.3px;
    margin:0;
  }
  .topbar-sub{
    font-size:13px;
    opacity:.85;
    margin-top:4px;
    font-weight:400;
  }
  .topbar-dates{
    display:flex;
    gap:8px;
    margin-top:14px;
    font-size:12px;
  }
  .date-chip{
    background:rgba(255,255,255,.15);
    padding:5px 10px;
    border-radius:20px;
    font-weight:500;
  }

  /* ---------- CATEGORY MENU ---------- */
  .cat-menu{
    display:flex;
    gap:8px;
    padding:14px 16px;
    overflow-x:auto;
    background:var(--white);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
    scrollbar-width:none;
  }
  .cat-menu::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:all .15s;
  }
  .cat-btn.active{
    background:var(--terracotta);
    border-color:var(--terracotta);
    color:#fff;
  }

  main{
    flex:1;
    padding:18px 16px 100px;
  }

  .section-title{
    font-size:17px;
    font-weight:700;
    margin:4px 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-desc{
    font-size:12.5px;
    color:#6b6355;
    margin:-8px 0 14px;
  }

  /* ---------- REGION TABS (for place lists) ---------- */
  .region-tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .region-tab{
    padding:6px 12px;
    border-radius:8px;
    background:var(--paper-2);
    font-size:12.5px;
    font-weight:600;
    color:#5a5346;
    cursor:pointer;
    border:1px solid transparent;
  }
  .region-tab.active{
    background:var(--leaf-deep);
    color:#fff;
  }

  /* ---------- PLACE CARD ---------- */
  .place-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .place-photo{
    height:110px;
    background:linear-gradient(135deg, var(--sand), var(--paper-2));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    position:relative;
  }
  .place-tag{
    position:absolute;
    top:10px; left:10px;
    background:rgba(30,42,34,.75);
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
  }
  .place-body{
    padding:13px 14px 14px;
  }
  .place-name{
    font-size:15.5px;
    font-weight:700;
    margin:0 0 3px;
  }
  .place-menu{
    font-size:12.5px;
    color:var(--terracotta);
    font-weight:600;
    margin-bottom:6px;
  }
  .place-addr{
    font-size:11.5px;
    color:#8a8272;
    line-height:1.5;
    margin-bottom:10px;
  }
  .place-actions{
    display:flex;
    gap:8px;
  }
  .map-btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    background:var(--paper-2);
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    color:var(--leaf-deep);
    text-decoration:none;
    border:none;
    cursor:pointer;
  }
  .rating-badge{
    font-size:11px;
    font-weight:700;
    color:var(--gold);
  }
  .dist-badge{
    font-size:11px;
    font-weight:700;
    color:var(--leaf-deep);
    background:var(--paper-2);
    padding:2px 8px;
    border-radius:10px;
  }
  .loc-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:14px;
    font-size:12.5px;
  }
  .loc-status{color:#6b6355;font-weight:600;}
  .loc-btn{
    padding:7px 13px;
    background:var(--leaf-deep);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .loc-btn.on{background:var(--terracotta);}
  .sort-toggle{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .sort-btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--white);
    font-size:12.5px;
    font-weight:700;
    color:#6b6355;
    cursor:pointer;
  }
  .sort-btn.active{
    background:var(--leaf-deep);
    border-color:var(--leaf-deep);
    color:#fff;
  }

  /* ---------- ITINERARY ---------- */
  .day-selector{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .day-selector::-webkit-scrollbar{display:none;}
  .day-pill{
    flex:0 0 auto;
    width:52px;
    height:58px;
    border-radius:12px;
    background:var(--white);
    border:1.5px solid var(--line);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:11px;
    color:#8a8272;
    font-weight:600;
    position:relative;
  }
  .day-pill .d-date{font-size:13px;font-weight:800;color:var(--ink);margin-top:2px;}
  .day-pill.active{
    background:var(--leaf-deep);
    border-color:var(--leaf-deep);
  }
  .day-pill.active .d-date, .day-pill.active{color:#fff;}
  .day-pill.done::after{
    content:"✓";
    position:absolute;
    top:-6px; right:-6px;
    width:18px;height:18px;
    background:var(--terracotta);
    color:#fff;
    border-radius:50%;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
  }

  .day-header{
    background:var(--leaf-deep);
    color:#fff;
    padding:14px 16px;
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .day-header-region{font-size:11px;opacity:.8;font-weight:600;letter-spacing:0.3px;}
  .day-header-title{font-size:17px;font-weight:700;margin-top:2px;}

  .timeline{
    background:var(--white);
    border:1px solid var(--line);
    border-top:none;
    border-radius:0 0 var(--radius) var(--radius);
    padding:6px 16px 14px;
    margin-bottom:20px;
  }
  .t-item{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .t-item:last-child{border-bottom:none;}
  .t-time{
    flex:0 0 52px;
    font-size:11.5px;
    font-weight:700;
    color:var(--terracotta);
    padding-top:2px;
  }
  .t-content{flex:1;}
  .t-name{font-size:14.5px;font-weight:700;margin-bottom:3px;}
  .t-blurb{font-size:12px;color:#71695a;line-height:1.5;}
  .t-check{
    flex:0 0 24px;
    height:24px;
    border-radius:50%;
    border:2px solid var(--line);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:transparent;
    margin-top:2px;
  }
  .t-check.checked{
    background:var(--leaf);
    border-color:var(--leaf);
    color:#fff;
  }

  .complete-btn{
    width:100%;
    padding:14px;
    background:var(--terracotta);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  .complete-btn.done{
    background:var(--paper-2);
    color:var(--leaf-deep);
  }

  /* ---------- SHOPPING ---------- */
  .shop-item{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .shop-emoji{font-size:26px;flex:0 0 auto;}
  .shop-name{font-size:14px;font-weight:700;}
  .shop-price{font-size:12px;color:var(--terracotta);font-weight:700;margin:2px 0 4px;}
  .shop-note{font-size:11.5px;color:#8a8272;line-height:1.5;}

  /* ---------- ALBUM ---------- */
  .album-upload{
    border:2px dashed var(--line);
    border-radius:14px;
    padding:24px 16px;
    text-align:center;
    background:var(--white);
    margin-bottom:18px;
  }
  .album-upload input{display:none;}
  .upload-label{
    display:inline-block;
    padding:11px 22px;
    background:var(--leaf-deep);
    color:#fff;
    border-radius:10px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:8px;
  }
  .album-day-group{margin-bottom:22px;}
  .album-day-label{
    font-size:13.5px;
    font-weight:700;
    color:var(--leaf-deep);
    margin-bottom:8px;
    padding-left:2px;
  }
  .album-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }
  .album-photo{
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    position:relative;
    background:var(--paper-2);
  }
  .album-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .album-photo .del{
    position:absolute;top:4px;right:4px;
    width:20px;height:20px;
    background:rgba(0,0,0,.55);
    color:#fff;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    cursor:pointer;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:#a49a86;
    font-size:13px;
  }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav{
    position:sticky;
    bottom:0;
    background:var(--white);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }
  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 0;
    background:none;
    border:none;
    cursor:pointer;
    color:#a49a86;
    font-size:12.5px;
    font-weight:700;
  }
  .nav-btn.active{color:var(--terracotta);}
  .nav-icon{font-size:26px;line-height:1;}

  .view{display:none;}
  .view.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  ::-webkit-scrollbar{width:0;height:0;}

  /* ---------- WEATHER CARD ---------- */
  .weather-card{
    background:linear-gradient(135deg, #7ea8c4, #5c8ab0);
    color:#fff;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .weather-left{display:flex;align-items:center;gap:10px;}
  .weather-icon{font-size:32px;}
  .weather-temp{font-size:22px;font-weight:800;}
  .weather-region{font-size:11.5px;opacity:.85;}
  .weather-right{text-align:right;font-size:11px;opacity:.9;line-height:1.5;}
  .weather-select{
    margin-top:8px;
    font-size:11px;
    background:rgba(255,255,255,.2);
    border:none;
    color:#fff;
    padding:4px 8px;
    border-radius:6px;
  }
  .weather-select option{color:#1e2a22;}

  /* ---------- DAY MAP BUTTON ---------- */
  .day-map-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    padding:11px;
    background:var(--leaf);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:12px;
    text-decoration:none;
  }

  /* ---------- LOCAL NAME TAG ---------- */
  .local-tag{
    font-size:11px;
    color:var(--gold);
    font-weight:600;
    margin-top:2px;
    font-style:italic;
  }

  .place-actions{gap:6px;}
  .goto-btn{
    flex:1;
    text-align:center;
    padding:8px 0;
    background:var(--leaf-deep);
    color:#fff;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    border:none;
    cursor:pointer;
  }
  .info-btn{
    flex:0 0 44px;
    text-align:center;
    padding:8px 0;
    background:var(--sand);
    color:var(--ink);
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    border:none;
    cursor:pointer;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,16,8,.55);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:100%;
    max-width:480px;
    background:var(--white);
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:82vh;
    overflow-y:auto;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{
    width:36px;height:4px;
    background:var(--line);
    border-radius:3px;
    margin:0 auto 16px;
  }
  .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .modal-title{font-size:19px;font-weight:800;}
  .modal-close{
    background:var(--paper-2);
    border:none;
    width:28px;height:28px;
    border-radius:50%;
    font-size:14px;
    cursor:pointer;
    color:#6b6355;
  }
  .modal-local{font-size:13px;color:var(--gold);font-style:italic;margin-bottom:14px;}
  .modal-photo{
    height:130px;
    border-radius:12px;
    background:linear-gradient(135deg, var(--sand), var(--paper-2));
    display:flex;align-items:center;justify-content:center;
    font-size:46px;
    margin-bottom:14px;
  }
  .modal-row{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--paper-2);
  }
  .modal-row-label{flex:0 0 68px;font-size:12px;color:#8a8272;font-weight:700;padding-top:1px;}
  .modal-row-value{flex:1;font-size:13.5px;line-height:1.6;}
  .modal-desc{
    font-size:13px;
    line-height:1.7;
    color:#4a4536;
    margin:14px 0;
    padding:12px;
    background:var(--paper);
    border-radius:10px;
  }
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions a, .modal-actions button{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:10px;
    font-size:13.5px;
    font-weight:700;
    text-decoration:none;
    border:none;
    cursor:pointer;
  }
  .modal-btn-map{background:var(--leaf-deep);color:#fff;}
  .modal-btn-go{background:var(--terracotta);color:#fff;}

  /* ---------- EXPENSE (경비) ---------- */
  .sticky-total{
    position:sticky; top:57px; z-index:15;
    background:var(--leaf-deep);
    color:#fff;
    display:flex;
    justify-content:space-around;
    padding:10px 8px;
    margin:-18px -16px 16px;
  }
  .sticky-item{text-align:center;}
  .sticky-lbl{font-size:9px;opacity:.75;letter-spacing:.05em;margin-bottom:2px;}
  .sticky-val{font-size:14.5px;font-weight:800;}

  .fx-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:16px;
  }
  .fx-head{
    background:linear-gradient(135deg, var(--leaf-deep), var(--leaf));
    padding:13px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .fx-title{color:#fff;font-size:13px;font-weight:700;}
  .fx-rate-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:rgba(255,255,255,.75);}
  .fx-rate-in{width:70px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:4px 6px;color:#fff;font-size:12px;font-weight:700;text-align:right;}
  .fx-body{display:grid;grid-template-columns:1fr 40px 1fr;padding:14px;gap:6px;align-items:center;}
  .fx-col-lbl{font-size:9.5px;font-weight:700;color:#8a8272;margin-bottom:6px;text-transform:uppercase;}
  .fx-in{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-weight:700;text-align:right;}
  .fx-swap-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:13px;cursor:pointer;}
  .fx-quick-row{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 14px;}
  .fx-qbtn{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:10.5px;font-weight:600;cursor:pointer;color:#5a5346;}

  .exp-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;}
  .exp-day-lbl{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--leaf-deep);}
  .exp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .exp-col-title{font-size:10.5px;font-weight:700;margin-bottom:6px;}
  .exp-item{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-radius:6px;padding:5px 8px;margin-bottom:4px;font-size:11px;}
  .exp-item .amt{font-weight:700;white-space:nowrap;margin-left:6px;}
  .exp-add-row{display:flex;gap:4px;margin-top:4px;}
  .exp-add-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:11px;}
  .exp-add-row button{flex:0 0 auto;background:var(--ink);color:#fff;border:none;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;}
  .exp-day-total{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;font-weight:700;}

  .tax-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .tax-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .tax-pbtn{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;}
  .tax-pbtn.sel{background:var(--leaf-deep);color:#fff;border-color:var(--leaf-deep);}
  .tax-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .tax-field label{font-size:9.5px;color:#8a8272;font-weight:700;display:block;margin-bottom:4px;}
  .tax-in{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:7px 8px;font-size:13px;font-weight:700;}
  .tax-result{background:var(--paper);border-radius:10px;padding:12px 14px;}
  .tax-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#5a5346;border-bottom:1px solid var(--paper-2);}
  .tax-row.total{border-top:2px solid var(--ink);border-bottom:none;margin-top:4px;padding-top:8px;font-weight:800;font-size:13px;color:var(--ink);}

  /* ---------- MEMO ---------- */
  .memo-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;}
  .memo-day-lbl{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--leaf-deep);}
  .memo-ta{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;resize:vertical;min-height:70px;font-family:inherit;}
  .memo-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .memo-count{font-size:10px;color:#a49a86;}
  .memo-save{background:var(--leaf-deep);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;}
  .memo-saved-tag{font-size:10px;color:var(--leaf);opacity:0;transition:opacity .3s;}
  .memo-saved-tag.show{opacity:1;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;align-items:center;justify-content:center;flex-direction:column;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:90vw;max-height:75vh;object-fit:contain;border-radius:6px;}
  .lightbox-close{position:absolute;top:18px;right:18px;color:#fff;font-size:26px;background:none;border:none;cursor:pointer;}
  .lightbox-nav{display:flex;gap:14px;margin-top:14px;}
  .lightbox-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:12.5px;cursor:pointer;}
  .lightbox-counter{color:rgba(255,255,255,.5);font-size:11px;margin-top:8px;}
  .photo-thumb-clickable{cursor:pointer;}

  /* ============================================================
     반응형: 태블릿/데스크톱 (768px 이상)
     - 모바일 디자인 톤은 그대로 유지, 레이아웃만 넓게 재배치
     ============================================================ */
  @media (min-width: 768px){
    body{ background:var(--paper-2); font-size:16px; }
    #app{
      max-width:100%;
      min-height:100vh;
    }
    .topbar{
      padding:34px 40px 26px;
    }
    .topbar-title{ font-size:30px; }
    .topbar-sub{ font-size:15px; }
    .date-chip{ font-size:13px; padding:7px 14px; }

    /* 타이포/카드 전반 확대 */
    .section-title{ font-size:20px; }
    .section-desc{ font-size:14px; }
    .place-name{ font-size:18px; }
    .place-menu{ font-size:14px; }
    .place-addr{ font-size:13px; }
    .place-photo{ font-size:48px; }
    .rating-badge{ font-size:13px; }
    .local-tag{ font-size:12.5px; }
    .day-header-title{ font-size:20px; }
    .day-header-region{ font-size:12.5px; }
    .t-name{ font-size:16.5px; }
    .t-blurb{ font-size:13.5px; }
    .t-time{ font-size:13px; flex-basis:64px; }
    .weather-temp{ font-size:26px; }
    .weather-region{ font-size:13px; }
    .day-pill{ width:64px; height:68px; }
    .day-pill .d-date{ font-size:15px; }
    .complete-btn{ font-size:15px; padding:15px; }
    .day-map-btn{ font-size:14.5px; padding:13px; }

    /* 하단 네비 숨기고, 상단 카테고리 메뉴를 고정 가로 메뉴로 확장 */
    .bottom-nav{ display:none; }
    .cat-menu{
      max-width:1100px;
      margin:0 auto;
      padding:14px 24px;
      justify-content:center;
      gap:10px;
    }
    .cat-btn{
      padding:10px 20px;
      font-size:14px;
    }

    main{
      max-width:1100px;
      margin:0 auto;
      padding:26px 24px 60px;
      width:100%;
    }

    /* 일정 탭: 좌우 2컬럼 (날짜선택+숙소+날씨 / 타임라인) */
    #view-itinerary{
      display:grid;
      grid-template-columns:300px 1fr;
      gap:24px;
      align-items:start;
    }
    #view-itinerary .day-selector{
      grid-column:1 / -1;
      overflow-x:visible;
      flex-wrap:wrap;
      justify-content:center;
    }
    #view-itinerary .weather-card,
    #view-itinerary > .place-card:first-of-type{
      grid-column:1;
    }
    #view-itinerary .day-header,
    #view-itinerary .timeline{
      grid-column:2;
    }
    #view-itinerary .day-header{ grid-row:2; }
    #view-itinerary .timeline{ grid-row:3; }
    #view-itinerary #liveWeatherResult{ grid-column:1; }

/* Attach coordinates to itinerary items by matching against FOOD/CAFE/SPA name substrings */
const ALL_PLACES = [...FOOD, ...CAFE, ...SPA];
function attachCoords(){
  DAYS.forEach(day=>{
    if(!day.items) return;
    day.items.forEach(item=>{
      if(item.lat) return;
      const match = ALL_PLACES.find(p => item.name.includes(p.name.split(' ')[0]) || p.name.includes(item.name.split(' ')[0]));
      if(match){ item.lat = match.lat; item.lng = match.lng; }
    });
  });
  Object.values(SUGGESTED_COURSES).forEach(list=>{
    list.forEach(item=>{
      if(item.lat) return;
      const match = ALL_PLACES.find(p => item.place && p.name.includes(item.place));
      if(match){ item.lat = match.lat; item.lng = match.lng; }
    });
  });
}

/* ============ 일정 공유 (Supabase, 방 코드 방식) ============ */
var SYNC = {cfg:null, ts:0, lastJson:null, t:null};
function syncCfgSave(){ try{ SYNC.cfg ? localStorage.setItem('bali_sync_v1', JSON.stringify(SYNC.cfg)) : localStorage.removeItem('bali_sync_v1'); }catch(e){} }
function syncChip(s){ const c=document.getElementById('syncChip'); if(c) c.textContent = ({off:'🔄 일정 공유 설정', ok:'🔄 일정 공유 중', err:'⚠️ 공유 연결 실패'})[s]; }
function syncRpc(fn, body){
  const c = SYNC.cfg;
  return fetch(c.url+'/rest/v1/rpc/'+fn, {method:'POST', headers:{'Content-Type':'application/json', apikey:c.key, Authorization:'Bearer '+c.key}, body:JSON.stringify(body)}).then(r=>r.ok ? r.json() : Promise.reject(r.status));
}
const syncNow = ()=>JSON.stringify(DAYS.map(d=>d.items));
function syncMaybePush(){
  if(!SYNC.cfg || syncNow()===SYNC.lastJson) return;
  clearTimeout(SYNC.t); SYNC.t = setTimeout(syncPush, 1500);
}
async function syncPush(){
  const cur = syncNow(), days = {}; DAYS.forEach(d=>days[d.id]=d.items);
  const doc = {ts:Date.now(), days};
  try{ await syncRpc('save_trip', {p_code:SYNC.cfg.code, p_data:doc}); SYNC.lastJson = cur; SYNC.ts = doc.ts; try{localStorage.setItem('bali_sync_ts', doc.ts);}catch(e){} syncChip('ok'); }catch(e){ syncChip('err'); }
}
async function syncPull(){
  if(!SYNC.cfg) return;
  try{
    const doc = await syncRpc('get_trip', {p_code:SYNC.cfg.code}); syncChip('ok');
    if(!doc){ if(syncNow()!==DEF_DAYS) syncPush(); return; }
    if(doc.ts > (SYNC.ts||0)){
      const ae = document.activeElement; if(ae && /TEXTAREA|INPUT/.test(ae.tagName)) return;
      DAYS.forEach(d=>{ if(doc.days[d.id]) d.items = doc.days[d.id]; });
      SYNC.ts = doc.ts; SYNC.lastJson = syncNow(); try{localStorage.setItem('bali_sync_ts', doc.ts);}catch(e){}
      state.currentView==='itinerary' ? renderItinerary() : saveDays();
    }
  }catch(e){ syncChip('err'); }
}
function syncMenu(){
  if(!SYNC.cfg){
    const url = prompt('Supabase Project URL (예: https://xxxx.supabase.co)'); if(!url) return;
    const key = prompt('anon public key'); if(!key) return;
    const code = prompt('방 코드 (10자 이상, 두 분만 아는 문자열)'); if(!code || code.trim().length<10){ alert('방 코드는 10자 이상이어야 해요'); return; }
    SYNC.cfg = {url:url.trim().replace(/\/$/,''), key:key.trim(), code:code.trim()}; syncCfgSave(); SYNC.lastJson = syncNow(); syncPull();
    alert('일정 공유를 켰어요. 칩을 다시 눌러 남편 폰용 링크를 만들 수 있어요.'); return;
  }
  const v = prompt('1: 상대방 폰용 링크 만들기\n2: 기본 일정으로 되돌리기(공유된 일정도 덮어씀)\n3: 공유 끄기','1');
  if(v==='1'){ const c=SYNC.cfg, b=btoa([c.url,c.key,c.code].map(encodeURIComponent).join('|')); prompt('이 링크를 상대방에게 보내세요 (복사해서 전달)', location.origin+location.pathname+'#s='+b); }
  if(v==='2' && confirm('일정을 처음 상태로 되돌리고 공유할까요?')){ JSON.parse(DEF_DAYS).forEach((it,i)=>DAYS[i].items=it); renderItinerary(); }
  if(v==='3'){ SYNC.cfg=null; syncCfgSave(); syncChip('off'); }
}
(function syncInit(){
  try{ const m=location.hash.match(/^#s=(.+)$/); if(m){ const [u,k,c]=atob(m[1]).split('|').map(decodeURIComponent); SYNC.cfg={url:u,key:k,code:c}; syncCfgSave(); } else SYNC.cfg=JSON.parse(localStorage.getItem('bali_sync_v1')||'null'); SYNC.ts=+(localStorage.getItem('bali_sync_ts')||0); }catch(e){}
  document.getElementById('syncChip').onclick = syncMenu;
  SYNC.lastJson = syncNow();
  if(SYNC.cfg){ syncChip('ok'); syncPull(); setInterval(()=>{ if(!document.hidden) syncPull(); }, 20000); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPull(); }); }
})();

  const w = WEATHER_REF[wRegionKey];

  const hotelKey = DAY_HOTEL[day.id];
  const hotel = hotelKey ? HOTELS[hotelKey] : null;

  const stopsWithCoords = day.items.filter(it=>it.lat && it.lng);
  let mapUrl = null;

  if(hotel){
    fullRoute = [{lat:hotel.lat,lng:hotel.lng}, ...stopsWithCoords, {lat:hotel.lat,lng:hotel.lng}];
  }
  if(fullRoute.length >= 2){
    const origin = fullRoute[0];
    const dest = fullRoute[fullRoute.length-1];
    const waypoints = fullRoute.slice(1,-1).map(s=>`${s.lat},${s.lng}`).join('|');
    mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${dest.lat},${dest.lng}` + (waypoints ? `&waypoints=${encodeURIComponent(waypoints)}` : '') + `&travelmode=driving`;
  } else if(stopsWithCoords.length === 1){
    mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${stopsWithCoords[0].lat},${stopsWithCoords[0].lng}&travelmode=driving`;
  }

  const hasAnyItems = day.items.length > 0;
  const suggestions = SUGGESTED_COURSES[day.id] || [];

  el.innerHTML = `

      renderItinerary();

  }

  el.querySelectorAll('.del-item').forEach(btn=>{

      const d = DAYS.find(x=>x.id===dId);

      const newName = prompt('일정 이름 수정', item.name);
      if(newName===null) return;

      renderItinerary();
    });

  if(addCustomBtnEl){

      const n = document.getElementById('customName').value.trim();
      const b = document.getElementById('customBlurb').value.trim();

      const newItem = {time: t || '시간미정', name:n, blurb: b || '직접 추가한 일정', emoji:'📌'};
      // 이름이 기존 맛집/카페/스파 DB와 매칭되면 좌표 자동 연결 (길찾기 버튼 활성화)
      const match = ALL_PLACES.find(p => n.includes(p.name.split(' ')[0]) || p.name.includes(n));
      if(match){ newItem.lat = match.lat; newItem.lng = match.lng; }
      day.items.push(newItem);
      day.items.sort((a,b2)=> (a.time||'').localeCompare(b2.time||''));
      document.getElementById('customTime').value='';
      document.getElementById('customName').value='';
      document.getElementById('customBlurb').value='';
      renderItinerary();
    });
  }

  const gmapSearchBtnEl = document.getElementById('gmapSearchBtn');
  if(gmapSearchBtnEl){
    gmapSearchBtnEl.addEventListener('click', ()=>{
      const q = document.getElementById('gmapSearchInput').value.trim();
      if(!q){ alert('검색할 장소명을 입력해주세요'); return; }
      window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + ' Bali')}`, '_blank');
      const nameInput = document.getElementById('customName');
      if(nameInput && !nameInput.value) nameInput.value = q;
    });
    document.getElementById('gmapSearchInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); gmapSearchBtnEl.click(); }
    });
  }

  loadLiveWeather(wRegionKey);
  document.getElementById('weatherRegionSelect').addEventListener('change', (e)=>{
    loadLiveWeather(e.target.value);
  });
}

/* 실시간 날씨 (Open-Meteo, 무료·API키 불필요) */
const WMO_ICON = (code)=>{
  if(code===0) return '☀️';
  if(code<=3) return '⛅';
  if(code<=48) return '🌫️';
  if(code<=57) return '🌦️';
  if(code<=67) return '🌧️';
  if(code<=77) return '🌨️';
  if(code<=82) return '🌧️';
  if(code<=86) return '🌨️';
  if(code>=95) return '⛈️';
  return '🌤️';
};
const WMO_TEXT = (code)=>{
  if(code===0) return '맑음';
  if(code<=3) return '구름 조금';
  if(code<=48) return '안개';
  if(code<=57) return '이슬비';
  if(code<=67) return '비';
  if(code<=77) return '눈';
  if(code<=82) return '소나기';
  if(code<=86) return '소낙눈';
  if(code>=95) return '뇌우';
  return '흐림';
};
async function loadLiveWeather(region){
  const ref = WEATHER_REF[region];
  if(!ref) return;
  const iconEl = document.getElementById('wIcon');
  const tempEl = document.getElementById('wTemp');
  const descEl = document.getElementById('wDesc');
  const updEl = document.getElementById('wUpdated');
  if(!tempEl) return;
  tempEl.textContent = '불러오는 중...';
  descEl.textContent = `${region} 실시간 날씨 조회 중`;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${ref.lat}&longitude=${ref.lng}&current=temperature_2m,weather_code,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSingapore&forecast_days=1`;
    const res = await fetch(url);
    const data = await res.json();
    const cur = data.current;
    const daily = data.daily;
    const icon = WMO_ICON(cur.weather_code);
    const text = WMO_TEXT(cur.weather_code);
    iconEl.textContent = icon;
    tempEl.textContent = `${Math.round(cur.temperature_2m)}°C`;
    descEl.textContent = `${region} 지금 ${text} · 습도 ${cur.relative_humidity_2m}%`;
    updEl.innerHTML = `오늘 최고 ${Math.round(daily.temperature_2m_max[0])}° / 최저 ${Math.round(daily.temperature_2m_min[0])}° · 강수확률 ${daily.precipitation_probability_max[0]}%`;
  }catch(err){
    tempEl.textContent = `${ref.avgHigh}° / ${ref.avgLow}°`;
    descEl.textContent = `${region} · 12월 평균 (실시간 조회는 파일/브라우저로 열 때만 가능)`;
    updEl.textContent = ref.note;
  }
}

/* ============ PLACE LIST VIEW (food/cafe/spa) ============ */
function renderPlaceList(view, data){
  const el = document.getElementById('view-'+view);
  const regions = ["전체", ...new Set(data.map(d=>d.region))];
  const activeRegion = el.dataset.region || "전체";
  const titleMap = {food:"🍽️ 맛집", cafe:"☕ 카페", spa:"💆 마사지샵"};
  const filtered = activeRegion === "전체" ? data : data.filter(d=>d.region===activeRegion);

  el.innerHTML = `
    <p class="section-title">${titleMap[view]}</p>
    <p class="section-desc">지역별로 골라 구글맵에서 위치와 사진을 바로 확인하세요</p>
    <div class="region-tabs">
      ${regions.map(r=>`<div class="region-tab ${r===activeRegion?'active':''}" data-region="${r}">${r}</div>`).join('')}
    </div>
    ${filtered.map((p,i)=>`
      <div class="place-card">
        <div class="place-photo">
          <span class="place-tag">${p.region}</span>
          ${p.emoji}
        </div>
        <div class="place-body">
          <div class="place-name">${p.name} ${p.rating ? `<span class="rating-badge">★${p.rating}</span>` : ''}</div>
          ${p.local ? `<div class="local-tag">💬 ${p.local}</div>` : ''}
          <div class="place-menu" style="margin-top:6px;">${p.menu}</div>
          <div class="place-addr">📍 ${p.addr}</div>
          <div class="place-actions">
            <a class="map-btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}">🗺️ 지도</a>
            <a class="goto-btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving">🧭 길찾기</a>
            <button class="info-btn" data-view="${view}" data-idx="${data.indexOf(p)}">ℹ️</button>
          </div>
          ${noteBox('u|'+view+':'+p.name)}
        </div>
      </div>
    `).join('')}
  `;
  el.querySelectorAll('.region-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ el.dataset.region = t.dataset.region; renderPlaceList(view, data); });

      openPlaceModal(d[+btn.dataset.idx]);
    });
  });
}

/* ============ EXPENSE VIEW (환율+세금 계산기, 경비 트래커) ============ */
const TAX_PRESETS = [
  {label:"PPN 11%", pct:11}, {label:"서비스 10%", pct:10}, {label:"PPN+서비스 21%", pct:21},
  {label:"레스토랑 15%", pct:15}, {label:"호텔세 20%", pct:20}
];
let taxState = {amt:0, pct:11, curr:"KRW"};

function fmtKRW(n){ return '₩'+Math.round(n).toLocaleString('ko-KR'); }
function fmtIDR(n){ return 'Rp '+Math.round(n).toLocaleString('id-ID'); }

function getExpenseTotals(){
  let cash=0, card=0;
  Object.values(state.expenses).forEach(day=>{
    (day.cash||[]).forEach(e=>cash+=e.amount);
    (day.card||[]).forEach(e=>card+=e.amount);
  });
  return {cash, card, total:cash+card};
}

function renderExpense(){
  const el = document.getElementById('view-expense');
  const totals = getExpenseTotals();
  const dayIdx = state.expenseDayIdx;
  const day = DAYS[dayIdx];
  if(!state.expenses[day.id]) state.expenses[day.id] = {cash:[], card:[]};
  const dayExp = state.expenses[day.id];
  const dayCash = dayExp.cash.reduce((s,e)=>s+e.amount,0);
  const dayCard = dayExp.card.reduce((s,e)=>s+e.amount,0);

  el.innerHTML = `
    <p class="section-title">💰 경비 · 환율 계산기</p>

    <div class="sticky-total">
      <div class="sticky-item"><div class="sticky-lbl">💵 현금 누계</div><div class="sticky-val">${fmtKRW(totals.cash)}</div></div>
      <div class="sticky-item"><div class="sticky-lbl">💳 카드 누계</div><div class="sticky-val">${fmtKRW(totals.card)}</div></div>
      <div class="sticky-item"><div class="sticky-lbl">✦ 총 경비</div><div class="sticky-val" style="color:var(--gold);">${fmtKRW(totals.total)}</div></div>
    </div>

    <div class="fx-card">
      <div class="fx-head">
        <div class="fx-title">💱 환율 계산기</div>
        <div class="fx-rate-row">1 IDR = <input class="fx-rate-in" id="fxRateIn" type="number" step="0.001" value="${state.fxRate}"> KRW</div>
      </div>
      <div class="fx-body">
        <div>
          <div class="fx-col-lbl">🇰🇷 원화 (KRW)</div>
          <input class="fx-in" id="krwIn" type="number" placeholder="0">
        </div>
        <button class="fx-swap-btn" id="fxSwapBtn">⇄</button>
        <div>
          <div class="fx-col-lbl">🇮🇩 루피아 (IDR)</div>
          <input class="fx-in" id="idrIn" type="number" placeholder="0">
        </div>
      </div>
      <div class="fx-quick-row" id="fxQuickRow"></div>
    </div>

    <div class="tax-card">
      <p style="font-size:12.5px;font-weight:700;margin-bottom:10px;">🧾 금액+세금 계산</p>
      <div class="tax-presets" id="taxPresetsRow"></div>
      <div class="tax-grid">
        <div class="tax-field"><label>금액</label><input class="tax-in" id="taxAmt" type="number" placeholder="0"></div>
        <div class="tax-field"><label>통화</label><select class="tax-in" id="taxCurr"><option value="KRW">KRW</option><option value="IDR">IDR</option></select></div>
        <div class="tax-field"><label>세율(%)</label><input class="tax-in" id="taxPct" type="number" value="11"></div>
      </div>
      <div class="tax-result">
        <div class="tax-row"><span>원래 금액</span><span id="taxBase">—</span></div>
        <div class="tax-row" id="taxRateRow"><span>세금 (11%)</span><span id="taxTax">—</span></div>
        <div class="tax-row total"><span>💳 최종 결제금액</span><span id="taxTotal">—</span></div>
      </div>
    </div>

    <div class="exp-card">
      <div class="exp-day-lbl">📅 날짜별 경비 기록</div>
      <select id="expDaySelect" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;margin-bottom:12px;">
        ${DAYS.map((d,i)=>`<option value="${i}" ${i===dayIdx?'selected':''}>${d.date} · ${d.region}</option>`).join('')}
      </select>
      <div class="exp-cols">
        <div>
          <div class="exp-col-title" style="color:var(--leaf-deep);">💵 현금</div>
          <div id="cashList"></div>
          <div class="exp-add-row">
            <input id="cashLabel" placeholder="내역">
            <input id="cashAmt" placeholder="금액" type="number">
            <button id="addCashBtn">+</button>
          </div>
        </div>
        <div>
          <div class="exp-col-title" style="color:var(--terracotta);">💳 카드</div>
          <div id="cardList"></div>
          <div class="exp-add-row">
            <input id="cardLabel" placeholder="내역">
            <input id="cardAmt" placeholder="금액" type="number">
            <button id="addCardBtn">+</button>
          </div>
        </div>
      </div>
      <div class="exp-day-total"><span>이 날 합계</span><span>${fmtKRW(dayCash+dayCard)}</span></div>
    </div>
  `;

  // 현금/카드 리스트 렌더
  const renderExpList = ()=>{
    document.getElementById('cashList').innerHTML = dayExp.cash.map((e,i)=>`
      <div class="exp-item"><span>${e.label}</span><span class="amt">${fmtKRW(e.amount)} <span style="cursor:pointer;color:#c1653a;" data-type="cash" data-idx="${i}" class="exp-del">✕</span></span></div>
    `).join('') || '<div style="font-size:11px;color:#a49a86;padding:4px 0;">기록 없음</div>';
    document.getElementById('cardList').innerHTML = dayExp.card.map((e,i)=>`
      <div class="exp-item"><span>${e.label}</span><span class="amt">${fmtKRW(e.amount)} <span style="cursor:pointer;color:#c1653a;" data-type="card" data-idx="${i}" class="exp-del">✕</span></span></div>
    `).join('') || '<div style="font-size:11px;color:#a49a86;padding:4px 0;">기록 없음</div>';
    el.querySelectorAll('.exp-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const type = btn.dataset.type, idx = +btn.dataset.idx;
        dayExp[type].splice(idx,1);
        renderExpense();
      });
    });
  };
  renderExpList();

  document.getElementById('expDaySelect').addEventListener('change', (e)=>{
    state.expenseDayIdx = +e.target.value;
    renderExpense();
  });
  document.getElementById('addCashBtn').addEventListener('click', ()=>{
    const label = document.getElementById('cashLabel').value.trim();
    const amount = parseInt(document.getElementById('cashAmt').value.replace(/[^0-9]/g,''),10)||0;
    if(!label||!amount) return;
    dayExp.cash.push({label, amount});
    renderExpense();
  });
  document.getElementById('addCardBtn').addEventListener('click', ()=>{
    const label = document.getElementById('cardLabel').value.trim();
    const amount = parseInt(document.getElementById('cardAmt').value.replace(/[^0-9]/g,''),10)||0;
    if(!label||!amount) return;
    dayExp.card.push({label, amount});
    renderExpense();
  });

  // 환율 계산기
  const krwInEl = document.getElementById('krwIn');
  const idrInEl = document.getElementById('idrIn');
  const fromKRW = ()=>{
    const k = parseFloat(krwInEl.value)||0;
    idrInEl.value = k>0 ? Math.round(k/state.fxRate) : '';
  };
  const fromIDR = ()=>{
    const i = parseFloat(idrInEl.value)||0;
    krwInEl.value = i>0 ? Math.round(i*state.fxRate) : '';
  };
  krwInEl.addEventListener('input', fromKRW);
  idrInEl.addEventListener('input', fromIDR);
  document.getElementById('fxSwapBtn').addEventListener('click', ()=>{
    const tmp = krwInEl.value; krwInEl.value = idrInEl.value; idrInEl.value = tmp;
  });
  document.getElementById('fxRateIn').addEventListener('input', (e)=>{
    const v = parseFloat(e.target.value);
    if(v>0){ state.fxRate = v; renderFxQuick(); }
  });

  function renderFxQuick(){
    const row = document.getElementById('fxQuickRow');
    if(!row) return;
    const krwAmts = [10000,50000,100000,300000];
    row.innerHTML = krwAmts.map(a=>`<button class="fx-qbtn" data-krw="${a}">${(a/10000).toFixed(0)}만원</button>`).join('');
    row.querySelectorAll('.fx-qbtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        krwInEl.value = btn.dataset.krw;
        fromKRW();
      });
    });
  }
  renderFxQuick();

  // 세금 계산기
  const taxPresetsRow = document.getElementById('taxPresetsRow');
  taxPresetsRow.innerHTML = TAX_PRESETS.map(t=>`<button class="tax-pbtn ${t.pct===taxState.pct?'sel':''}" data-pct="${t.pct}">${t.label}</button>`).join('');
  const calcTax = ()=>{
    const amt = parseFloat(document.getElementById('taxAmt').value)||0;
    const pct = parseFloat(document.getElementById('taxPct').value)||0;
    const curr = document.getElementById('taxCurr').value;
    taxState = {amt, pct, curr};
    const tax = amt*pct/100;
    const total = amt+tax;
    document.getElementById('taxRateRow').querySelector('span').textContent = `세금 (${pct}%)`;
    if(amt===0){
      document.getElementById('taxBase').textContent='—';
      document.getElementById('taxTax').textContent='—';
      document.getElementById('taxTotal').textContent='—';
      return;
    }
    const f = curr==='KRW' ? fmtKRW : fmtIDR;
    document.getElementById('taxBase').textContent = f(amt);
    document.getElementById('taxTax').textContent = f(tax);
    document.getElementById('taxTotal').textContent = f(total);
  };
  document.getElementById('taxAmt').addEventListener('input', calcTax);
  document.getElementById('taxPct').addEventListener('input', calcTax);
  document.getElementById('taxCurr').addEventListener('change', calcTax);
  taxPresetsRow.querySelectorAll('.tax-pbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('taxPct').value = btn.dataset.pct;
      calcTax();
    });
  });
}

/* ===== 앨범: 사진+글 게시 (IndexedDB 저장, 불가 시 메모리) ===== */
let POSTS = [], compose = {imgs:[], text:'', day:0}, idbOK = null;
const idb = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('bali_album',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{idb.db=r.result;res(true)}; r.onerror=()=>res(false); }catch(e){res(false)} }); },
  get(){ return new Promise(res=>{ if(!idb.db) return res(null); const q=idb.db.transaction('kv').objectStore('kv').get('posts'); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); },
  set(v){ if(!idb.db) return; try{ idb.db.transaction('kv','readwrite').objectStore('kv').put(v,'posts'); }catch(e){} }
};
idb.open().then(ok=>{ idbOK=ok; return idb.get(); }).then(v=>{ if(v) POSTS=v; if(state.currentView==='album') renderAlbum(); });
const savePosts = ()=>idb.set(POSTS);
function shrink(file){ return new Promise(res=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ const s=Math.min(1,1280/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.8)); }; im.onerror=()=>res(null); im.src=u; }); }
function renderAlbum(){
  const el = document.getElementById('view-album');
  const sty = 'width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;margin-bottom:10px;';
  el.innerHTML = `<p class="section-title">📷 여행 앨범</p>
    ${idbOK===false ? '<div style="background:#fff3cd;color:#7a5b00;padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;">⚠️ 이 화면에서는 사진·글이 저장되지 않아요. 크롬 브라우저로 열어주세요.</div>' : ''}
    <div class="memo-card" style="margin-bottom:18px;">
      <select id="pDay" style="${sty}">${DAYS.map((d,i)=>`<option value="${i}" ${i===compose.day?'selected':''}>${d.date} · ${d.region}</option>`).join('')}</select>
      <textarea class="memo-ta" id="pText" placeholder="오늘의 기록을 남겨보세요 🌴">${esc(compose.text)}</textarea>
      ${compose.imgs.length ? `<div class="album-grid" style="margin-top:10px;">${compose.imgs.map((u,i)=>`<div class="album-photo"><img src="${u}"><div class="del" data-rm="${i}">✕</div></div>`).join('')}</div>` : ''}
      <div class="memo-bottom"><label class="upload-label" style="margin:0;">📸 사진 추가<input type="file" id="pFile" accept="image/*" multiple></label><button class="memo-save" id="pPost">게시</button></div>
    </div>
    <div id="feed"></div>
    <div style="display:flex;gap:8px;margin-top:16px;"><button class="memo-save" id="pExp" style="background:var(--paper-2);color:var(--leaf-deep);">💾 백업 저장</button><label class="upload-label" style="margin:0;">📂 백업 불러오기<input type="file" id="pImp" accept=".json"></label></div>`;
  const hm = t=>{ const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  document.getElementById('feed').innerHTML = POSTS.length ? POSTS.map(p=>{
    const d = DAYS.find(x=>x.id===p.day) || DAYS[0];
    return `<div class="place-card" style="padding:14px;margin-bottom:14px;"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="font-size:12px;font-weight:800;color:var(--leaf-deep);">${d.date} · ${d.region}</div><div style="font-size:11px;color:#8a8272;">${hm(p.ts)}<span data-pedit="${p.id}" style="cursor:pointer;margin-left:10px;">✏️</span><span data-pdel="${p.id}" style="cursor:pointer;margin-left:10px;color:#c1653a;">✕</span></div></div>
      ${p.imgs.length ? `<div class="album-grid" style="margin-top:10px;">${p.imgs.map((u,i)=>`<div class="album-photo" data-pid="${p.id}" data-i="${i}"><img src="${u}"></div>`).join('')}</div>` : ''}
      ${p.text ? `<div style="margin-top:10px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;">${esc(p.text)}</div>` : ''}</div>`;
  }).join('') : `<div class="empty-state">아직 게시글이 없어요.<br>사진과 함께 오늘의 기록을 남겨보세요 🌴</div>`;
  el.oninput = e=>{ if(e.target.id==='pText') compose.text = e.target.value; };
  el.onchange = async e=>{
    const t = e.target;
    if(t.id==='pDay') compose.day = +t.value;
    if(t.id==='pFile'){ for(const f of t.files){ const u = await shrink(f); if(u) compose.imgs.push(u); } renderAlbum(); }
    if(t.id==='pImp' && t.files[0]){ try{ const a = JSON.parse(await t.files[0].text()); if(Array.isArray(a)){ POSTS = a.concat(POSTS.filter(p=>!a.some(q=>q.id===p.id))); savePosts(); renderAlbum(); } }catch(err){ alert('백업 파일을 읽지 못했어요'); } }
  };
  el.onclick = e=>{
    const t = e.target, ds = t.dataset || {};
    if(ds.rm!==undefined){ compose.imgs.splice(+ds.rm,1); renderAlbum(); return; }
    if(t.id==='pPost'){ if(!compose.text.trim() && !compose.imgs.length) return; POSTS.unshift({id:Date.now()+'', day:DAYS[compose.day].id, ts:Date.now(), text:compose.text.trim(), imgs:compose.imgs}); compose = {imgs:[], text:'', day:compose.day}; savePosts(); renderAlbum(); return; }
    if(ds.pdel){ if(confirm('이 게시글을 삭제할까요?')){ POSTS = POSTS.filter(p=>p.id!==ds.pdel); savePosts(); renderAlbum(); } return; }
    if(ds.pedit){ const p = POSTS.find(x=>x.id===ds.pedit), v = prompt('글 수정', p.text); if(v!==null){ p.text = v; savePosts(); renderAlbum(); } return; }
    if(t.id==='pExp'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(POSTS)],{type:'application/json'})); a.download = 'bali_album_backup.json'; a.click(); return; }
    const ph = t.closest('.album-photo'); if(ph && ph.dataset.pid){ const p = POSTS.find(x=>x.id===ph.dataset.pid); openLightbox(p.imgs, +ph.dataset.i); }
  };
}

  const btn = e.target.closest('.cat-btn');
  if(btn) switchView(btn.dataset.view);

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.nav));
});
renderCurrentView();
</script>
